<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Infographic và video Nhiệm vụ 2.2</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			font-family: Arial, sans-serif;
			color: #1f2937;
			background: #eef2ff;
		}
		main {
			width: min(1100px, 92%);
			margin: 32px auto;
			padding: 32px;
			background: #fff;
			border-radius: 18px;
			box-shadow: 0 8px 24px #1e3a8a22;
		}
		h1 { margin-top: 0; color: #1d4ed8; text-align: center; }
		.intro { text-align: center; color: #4b5563; }
		.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 28px; }
		section { padding: 20px; background: #f8fafc; border-radius: 12px; }
		h2 { margin-top: 0; color: #1e40af; font-size: 1.25rem; }
		img { display: block; width: 100%; height: auto; border-radius: 8px; }
		.video { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
		iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 8px; }
		footer { margin-top: 24px; text-align: center; font-size: .9rem; color: #6b7280; }
		@media (max-width: 700px) { main { padding: 20px; } .grid { grid-template-columns: 1fr; } }
	</style>
</head>
<body>
	<main>
		<h1>Infographic và video Nhiệm vụ 2.2</h1>
		<p class="intro">Khám phá nội dung infographic và xem video hướng dẫn thực hiện bài tập Nhiệm vụ 2.2.</p>

		<div class="grid">
			<section>
				<h2>Infographic</h2>
				<img src="Lab05_Ex2.1.png" alt="Infographic của bài thực hành">
			</section>
			<section>
				<h2>Video bài tập Nhiệm vụ 2.2</h2>
				<div class="video">
					<iframe 
                        src="https://www.youtube.com/embed/msWrYb067jI"
                        title="Video hướng dẫn HTML cho Nhiệm vụ 2.2"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        allowfullscreen>
                    </iframe>
				</div>
			</section>
		</div>

		<footer>© 2025 Lab05. Infographic: Lab05_Ex2.1.png. Video thuộc bản quyền của tác giả trên YouTube.</footer>
	</main>
</body>
</html>
